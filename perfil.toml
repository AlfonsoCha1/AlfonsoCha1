#  perfil.toml · Datos de tu muro de GitHub (el README de tu perfil)
#
#  1. Edita este archivo (desde tu computadora o desde github.com).
#  2. Genera el README y las imágenes:
#        python scripts/generar.py
#     Si lo editas en github.com, la acción «Generar perfil» lo hace sola.
#
#  Reglas rápidas
#    publicar = false  → oculta el elemento sin borrarlo
#    orden = 1, 2, 3…  → número menor aparece primero
#    destacado = true  → el proyecto sale con portada en la sección principal
#    visibilidad = "privado" → no se enlaza el código, solo su página (demo)
#  Guía completa: docs/MANTENIMIENTO.md
# ══════════════════════════════════════════════════════════════════════

