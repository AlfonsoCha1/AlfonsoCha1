  "Propone correcciones acotadas con vista previa, aprobación ligada al cambio exacto, respaldo, verificación y reversión.",
  "Exporta informes en HTML, Markdown y JSON.",
]
nota = "Probado en Ubuntu 24.04 (base de Linux Mint 22). Windows y macOS: prototipo. El resto del kit está diseñado y marcado como pendiente."
tecnologias = ["Python (stdlib)", "Linux", "Gitleaks", "HTML/CSS/JS"]

