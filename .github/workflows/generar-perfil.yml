# Regenera el README y las imágenes cuando cambias perfil.toml (por ejemplo, desde github.com).
# Solo hace commit si el resultado cambió: nunca crea commits vacíos ni actividad artificial.
name: Generar perfil

on:
  push:
    branches: [main]
    paths:
      - "perfil.toml"
      - "scripts/**"
      - "assets/fuente/**"
  workflow_dispatch:

permissions:
  contents: write # mínimo necesario para guardar el README regenerado

concurrency:
  group: generar-perfil
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar README e imágenes
        run: python scripts/generar.py

      - name: Guardar cambios (solo si hay)
        run: |
          if [ -z "$(git status --porcelain -- README.md assets)" ]; then
            echo "Todo estaba al día; no hay nada que guardar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- README.md assets
          git commit -m "Regenerar README desde perfil.toml"
          git push
